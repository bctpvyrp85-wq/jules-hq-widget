name: Validate public widget

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate JSON snapshots
        run: node scripts/validate-status.mjs
      - name: Parse-check Scriptable widget
        run: node --check --input-type=module < scriptable/StatusWidget.js
